<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AML Case Review</title>
<style>
:root {
  --bg: #fff; --surface: #fff; --ink: #151515; --muted: #686868; --faint: #777;
  --rule: #e8e8e8; --hover: #f7f7f7; --accent: #151515; --accent-soft: #f3f3f3;
  --close: #151515; --rfi: #555; --esc: #151515;
  --font: Arial, Helvetica, sans-serif;
  --text: 14px; --small: 12px; --title: 28px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button, summary, a, input, select { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid #151515; outline-offset: 4px; }
a { color: inherit; }
button { cursor: pointer; }
b, strong { font-weight: 600; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.top { min-width: 0; min-height: 82px; padding: 0 32px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; border-bottom: 1px solid var(--rule); }
.brand { display: contents; }
.wordmark { font-size: var(--text); font-weight: 600; }
.brand-label { font-size: var(--text); color: var(--muted); }
.industry-picker { justify-self: end; display: flex; align-items: center; gap: 14px; }
.industry-picker label { color: var(--muted); font-size: var(--small); }
.industry-picker select { max-width: 230px; padding: 8px 28px 8px 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; font-size: var(--text); }
.panes { display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: 0; }
.queue { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; background: #fff; border-right: 1px solid var(--rule); }
.filters { padding: 27px 22px 20px; display: grid; gap: 16px; }
.queue-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font: 400 12px/1.5 var(--font); color: var(--muted); }
.count { font: 12px/1.5 var(--font); color: var(--muted); }
.filters input { width: 100%; border: 0; border-bottom: 1px solid #d7d7d7; padding: 10px 0; border-radius: 0; background: transparent; font-size: var(--text); }
.filters input::placeholder { color: var(--muted); }
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.filters select { width: 100%; min-width: 0; padding: 5px 0; border: 0; border-radius: 0; background: transparent; font-size: var(--small); color: var(--muted); }
.list { overflow-y: auto; min-height: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; padding: 19px 22px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--rule); background: transparent; position: relative; }
.row:hover { background: #f0f0f0; }
.row[aria-current="true"] { background: #f5f5f5; }
.row[aria-current="true"]::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 2px; background: #151515; }
.row .who { grid-column: 1; grid-row: 1; font-size: var(--text); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .id { grid-column: 1; grid-row: 2; font: 12px/1.6 var(--font); color: var(--muted); }
.row .rules { grid-column: 2; grid-row: 2; font: 12px/1.6 var(--font); text-align: right; color: var(--muted); }
.row .verdict { grid-column: 2; grid-row: 1; font-size: var(--small); align-self: center; justify-self: end; }
.queue-foot { border-top: 1px solid var(--rule); padding: 14px 22px; font-size: var(--small); color: var(--muted); display: flex; justify-content: space-between; }
kbd { font: 12px var(--font); }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-size: var(--small); font-weight: 400; white-space: nowrap; }
.verdict::before { content: ""; width: 5px; height: 5px; background: currentColor; border-radius: 50%; }
.v-RFI::before { background: transparent; border: 1px solid currentColor; }
.v-ESCALATE::before { border-radius: 0; transform: rotate(45deg); }
.v-MISSING { color: var(--muted); }
.case { --muted: var(--ink); overflow-y: auto; min-height: 0; min-width: 0; }
.case-inner { width: 100%; max-width: 1120px; margin: 0 auto; padding: 32px 44px 64px; }
.case-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
.case-navigation { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.case-position { color: var(--muted); font-size: var(--small); }
.nav-button { background: #fff; border: 1px solid #d5d5d5; border-radius: 4px; padding: 6px 10px; font-size: var(--small); }
.nav-button:hover:not(:disabled) { border-color: #151515; }
.nav-button:disabled { color: #777; border-color: #e8e8e8; cursor: default; }
.head { padding-bottom: 24px; margin-bottom: 0; }
.head h1 { margin: 0 0 10px; font-size: var(--title); font-weight: 400; line-height: 1.2; overflow-wrap: anywhere; }
.head .sub { color: var(--muted); font-size: var(--text); }
.head .sub span + span::before { content: "/"; margin: 0 12px; color: #b0b0b0; }
.decision { padding-top: 24px; }
.decision-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.decision .line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 15px; }
.decision .verdict { padding: 0; background: transparent; color: var(--ink); font-size: var(--text); }
.decision.RFI .verdict { background: transparent; color: var(--ink); }
.decision .code { font-size: var(--text); color: var(--muted); }
.decision p { margin: 0; max-width: 76ch; font-size: var(--text); line-height: 1.75; color: inherit; }
.evidence-block { margin-top: 23px; }
.evidence-label { font: 600 12px var(--font); color: var(--muted); margin-bottom: 10px; }
.evidence { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
.ref { display: flex; align-items: center; justify-content: space-between; gap: 16px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 12px 0; font: 12px/1.5 var(--font); text-align: left; min-width: 0; }
.ref-label { min-width: 0; overflow-wrap: anywhere; }
.ref-id { display: block; font-size: var(--small); color: var(--muted); margin-top: 2px; }
.ref-action { color: var(--muted); font-size: var(--small); }
.ref:hover { border-color: #151515; }
.dossier { border-top: 1px solid var(--rule); }
.dossier:last-child { border-bottom: 1px solid var(--rule); }
.dossier > summary { display: flex; align-items: center; gap: 14px; padding: 18px 0; cursor: pointer; list-style: none; font-size: var(--text); font-weight: 400; }
.dossier > summary::-webkit-details-marker, .doc summary::-webkit-details-marker { display: none; }
.dossier > summary::after { content: "+"; margin-left: auto; font: 12px var(--font); color: var(--muted); }
.dossier[open] > summary::after { content: "−"; }
.n { color: var(--muted); font: 12px var(--font); font-weight: 400; }
.section-body { padding: 0 0 24px; min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px 28px; margin: 0; }
.facts dt { color: var(--muted); font-size: var(--small); margin-bottom: 4px; }
.facts dd { margin: 0; font-size: var(--text); overflow-wrap: anywhere; }
.alert { padding: 14px 0; border-top: 1px solid var(--rule); }
.alert:first-child { border: 0; padding-top: 0; }
.alert .name { font-weight: 400; font-size: var(--text); }
.alert .rid { font: 12px var(--font); margin-right: 12px; color: var(--muted); }
.alert p { margin: 7px 0 0; color: var(--muted); font-size: var(--text); max-width: 85ch; }
.table-wrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: var(--text); }
th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: var(--small); color: var(--muted); font-weight: 400; white-space: nowrap; }
th:first-child, td:first-child { padding-left: 0; }
td.num, th.num { text-align: right; white-space: nowrap; font-family: var(--font); }
td.when { white-space: nowrap; color: var(--muted); }
td.tid { font: 12px/1.8 var(--font); white-space: nowrap; }
tr.cited td { background: #f8f8f8; }
.tag { font-size: var(--small); color: var(--muted); }
.tag.on { color: var(--ink); }
.toggle { margin-top: 16px; border: 0; border-bottom: 1px solid #ccc; background: none; padding: 3px 0; font-size: var(--small); }
.doc { border-top: 1px solid var(--rule); }
.doc:first-child { border-top: 0; }
.doc summary { display: flex; flex-wrap: wrap; gap: 5px 14px; align-items: baseline; padding: 14px 0; cursor: pointer; list-style: none; }
.doc summary::before { content: "+"; font: 12px var(--font); color: var(--muted); }
.doc[open] summary::before { content: "−"; }
.doc summary .t { font-size: var(--text); font-weight: 400; }
.doc summary .meta { color: var(--muted); font: 12px/1.6 var(--font); }
.doc summary .tag { margin-left: auto; }
.doc .body { padding: 5px 20px 24px; display: grid; gap: 12px; max-width: 90ch; font-size: var(--text); overflow-wrap: anywhere; }
.doc .body p { margin: 0; }
.doc .body dl { display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 5px 20px; margin: 0; }
.doc .body dt { color: var(--muted); }
.doc .body dd { margin: 0; }
.note { padding: 14px 0; border-top: 1px solid var(--rule); font-size: var(--text); }
.note:first-child { border-top: 0; padding-top: 0; }
.note .meta { color: var(--muted); font-size: var(--small); }
.empty, .err { padding: 40px 24px; color: var(--muted); }
.flash, tr.flash td { animation: flash 1.3s ease-out; }
@keyframes flash { from { background: #dedede; } }
@media (max-width: 1180px) {
  .top { gap: 28px; padding: 0 24px; }
  .case-inner { padding: 36px 32px 64px; }
  .panes { grid-template-columns: 280px minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .top { flex-wrap: wrap; gap: 16px 24px; padding-top: 18px; padding-bottom: 18px; }
}
@media (max-width: 680px) {
  .top { grid-template-columns: auto minmax(0, 1fr); padding-left: 20px; padding-right: 20px; }
  .brand-label { display: none; }
  .industry-picker { gap: 8px; }
  .industry-picker select { max-width: 170px; }
  .panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: 34vh minmax(0, 1fr); }
  .queue { border-right: 0; border-bottom: 1px solid var(--rule); }
  .filters { padding: 12px 20px; gap: 5px; }
  .queue-foot { display: none; }
  .queue { grid-template-rows: auto minmax(0, 1fr); }
  .row { padding: 12px 20px; }
  .case-inner { padding: 28px 22px 48px; }
  .case-toolbar { align-items: flex-start; flex-direction: column; gap: 10px; }
  .evidence { grid-template-columns: minmax(0, 1fr); }
  .section-body { padding-left: 0; }
  .decision p { font-size: var(--text); }
  .head .sub span { display: block; }
  .head .sub span + span::before { content: none; }
}
.review-panel { margin: 0; padding: 0; }
.review-heading { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.review-heading h2 { margin: 0; }
.review-heading select { background: #fff; border: 1px solid #d5d5d5; border-radius: 4px; padding: 9px 32px 9px 12px; font-size: var(--text); min-width: 190px; }
.review-state { font-size: var(--small); color: var(--muted); margin: 8px 0 0; }
.review-note { font-size: var(--text); margin: 16px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.review-note-label { font-size: var(--small); color: var(--muted); margin: 16px 0 4px; }
.review-edit { margin-top: 20px; }
.review-edit label { display: block; margin-bottom: 8px; font-size: var(--text); }
.review-edit textarea { display: block; width: 100%; resize: vertical; min-height: 86px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: var(--text); }
.review-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
.primary-button { background: #151515; color: #fff; border: 1px solid #151515; border-radius: 4px; padding: 9px 16px; font-size: var(--text); font-weight: 400; }
.primary-button:disabled { opacity: .6; cursor: wait; }
.text-button { padding: 0; border: 0; background: transparent; border-bottom: 1px solid #ccc; font-size: var(--small); color: var(--muted); }
.review-error { color: var(--ink); font-size: var(--small); margin-top: 12px; }
.local-warning { padding: 12px 24px; border-bottom: 1px solid var(--rule); font-size: var(--small); }
[hidden] { display: none !important; }
@media (max-width: 680px) {
 .review-heading { align-items: flex-start; flex-direction: column; gap: 10px; }
 .review-heading select { width: 100%; }
}
.case-section { border-top: 1px solid var(--rule); padding: 28px 0; }
.case-section > h2, .review-heading h2 { font-size: var(--text); font-weight: 600; line-height: 1.5; margin: 0 0 20px; }
.review-heading h2 { margin-bottom: 0; }
.case b, .case strong { font-weight: 400; }
.case .ref { font-size: var(--text); }
.case .ref-id, .case .ref-action { font-size: var(--small); }
.recommendation-label { display: block; margin: 0 0 10px; font-size: var(--text); }
.case-section > .dossier:first-of-type { border-top: 0; }
.case-section > .dossier:last-child { border-bottom: 0; }
.case .nav-button:disabled { color: inherit; opacity: .45; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="wordmark">AML</span><span class="brand-label">Case review</span></div>
    <div class="industry-picker"><label for="industries">Industries</label><select id="industries" aria-label="Industries"></select></div>
  </header>
  <div class="panes">
    <aside class="queue" aria-label="Case queue">
      <div class="filters">
        <div class="queue-heading"><span class="eyebrow">Case queue</span><span class="count" id="count"></span></div>
        <input id="q" type="search" placeholder="Search name, case ID or reason" aria-label="Search cases">
        <div class="filter-row">
          <select id="fv" aria-label="Filter by verdict">
            <option value="">All decisions</option>
            <option value="CLOSE">Close</option>
            <option value="RFI">Request information</option>
            <option value="ESCALATE">Escalate</option>
          </select>
          <select id="fr" aria-label="Filter by rule"><option value="">All alert types</option></select>
        </div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Cases"></div>
      <div class="queue-foot"><span>Local workspace</span><span><kbd>↑ ↓</kbd> Change case</span></div>
    </aside>
    <main class="case" id="case"><div class="empty">Select a case to review its decision and evidence.</div></main>
  </div>
</div>

<script>
const VERDICT = { CLOSE: "Close", RFI: "Request information", ESCALATE: "Escalate", MISSING: "No decision" };
const RULES = {
  TM01: "Activity exceeds the expected profile", TM02: "Rapid movement of funds",
  TM03: "Repeated transactions below a threshold", TM04: "Many-to-one or one-to-many payments",
  TM05: "Large or unexpected cash", TM06: "Unexpected higher-risk corridor", TM07: "Dormant account reactivation",
  TM08: "Third-party funding or payout", TM10: "Unusually early fund redemption", TM22: "Counterparty on an internal list"
};
const REVIEW_KEY = "aml-analyst-decisions-v1";
let savedReviews = {};
let reviewLoadError = false;
try {
  const stored = JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}");
  if (!stored || typeof stored !== "object" || Array.isArray(stored)) throw new Error("Invalid saved decisions");
  savedReviews = stored;
} catch (e) { reviewLoadError = true; }
const reviewKey = (inst, id) => inst + "/" + id;
function caseReview(inst, id) {
  const review = savedReviews[reviewKey(inst, id)];
  return review && ["CLOSE", "RFI", "ESCALATE"].includes(review.verdict) && typeof review.note === "string" ? review : null;
}
function effectiveRow(row, inst) {
  const review = caseReview(inst, row.case_id);
  return { ...row, system_verdict: row.system_verdict || row.verdict, verdict: review?.verdict || row.system_verdict || row.verdict, analyst_note: review?.note || "" };
}
const state = { insts: [], inst: null, rows: [], view: [], current: null, data: null, institutionRequest: 0, caseRequest: 0 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/\u2014/g, "; ").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gbp = (n) => n == null ? "" : "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateFmt = (s) => {
  if (!s) return "";
  const d = new Date(s.length <= 10 ? s + "T00:00:00Z" : s);
  return isNaN(d) ? s : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
};
const verdictHtml = (v) => `<span class="verdict v-${esc(v)}">${esc(VERDICT[v] || v)}</span>`;
const words = (code) => (code || "").replace(/^(RFI|ESC)_/, "").toLowerCase().replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Request failed: " + r.status);
  return r.json();
}

function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [inst, id] = h.split("/");
  return { inst, id };
}

async function init() {
  try {
    state.insts = await get("/api/institutions");
  } catch (e) {
    $("case").innerHTML = `<div class="err">The workbench server is not running. Start it with: python3 ui/serve.py</div>`;
    return;
  }
  const { inst, id } = readHash();
  $("industries").innerHTML = state.insts.map((i) => `<option value="${esc(i.key)}">${esc(i.name)}</option>`).join("");
  $("industries").addEventListener("change", () => selectInst($("industries").value));
  if (reviewLoadError) {
    const warning = document.createElement("div");
    warning.className = "local-warning";
    warning.setAttribute("role", "alert");
    warning.textContent = "Saved analyst decisions could not be loaded. Local editing is unavailable until browser storage is restored.";
    document.body.prepend(warning);
  }
  ["q", "fv", "fr"].forEach((x) => $(x).addEventListener("input", applyFilters));
  $("list").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) openCase(r.dataset.id); });
  $("list").addEventListener("keydown", moveSelection);
  window.addEventListener("hashchange", () => {
    const h = readHash();
    if (h.inst && h.inst !== state.inst) selectInst(h.inst, h.id);
    else if (h.id && h.id !== state.current) openCase(h.id, true);
  });
  await selectInst(state.insts.some((i) => i.key === inst) ? inst : state.insts[0].key, id);
}

async function selectInst(key, openId) {
  const request = ++state.institutionRequest;
  ++state.caseRequest;
  state.inst = key;
  state.current = null;
  state.data = null;
  state.rows = [];
  state.view = [];
  ["q", "fv", "fr"].forEach((id) => $(id).disabled = true);
  $("list").innerHTML = `<div class="empty" role="status">Loading cases...</div>`;
  $("case").innerHTML = `<div class="empty" role="status">Loading cases...</div>`;
  $("industries").value = key;
  $("count").textContent = "Loading...";
  let rows;
  try { rows = await get("/api/cases?inst=" + encodeURIComponent(key)); }
  catch (e) {
    if (request !== state.institutionRequest) return;
    state.rows = []; state.view = [];
    ["q", "fv", "fr"].forEach((id) => $(id).disabled = false);
    $("count").textContent = "Unavailable";
    $("list").innerHTML = `<div class="empty">Cases could not be loaded.</div>`;
    $("case").innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  if (request !== state.institutionRequest) return;
  state.rows = rows.map((row) => effectiveRow(row, key));
  ["q", "fv", "fr"].forEach((id) => $(id).disabled = false);
  const rules = [...new Set(state.rows.flatMap((r) => r.rules))].sort();
  $("fr").innerHTML = `<option value="">All alert types</option>` +
    rules.map((r) => `<option value="${esc(r)}">${esc(r)}: ${esc(RULES[r] || r)}</option>`).join("");
  applyFilters(openId);
}

function applyFilters(preferredId) {
  const q = $("q").value.trim().toLowerCase(), v = $("fv").value, rule = $("fr").value;
  state.view = state.rows.filter((r) =>
    (!v || r.verdict === v) && (!rule || r.rules.includes(rule)) &&
    (!q || (r.case_id + " " + r.customer + " " + r.reason_code + " " + r.analyst_note).toLowerCase().includes(q)));
  $("count").textContent = state.view.length === state.rows.length
    ? `${state.rows.length} cases` : `${state.view.length} of ${state.rows.length} cases`;
  const desired = typeof preferredId === "string" && state.view.some((r) => r.case_id === preferredId) ? preferredId
    : state.view.some((r) => r.case_id === state.current) ? state.current : state.view[0]?.case_id;
  $("list").innerHTML = state.view.map((r) =>
    `<button class="row" role="option" data-id="${esc(r.case_id)}" aria-current="${r.case_id === state.current}" aria-selected="${r.case_id === state.current}">
       <span class="id">${esc(r.case_id)}</span>${verdictHtml(r.verdict).replace("Request information", "RFI")}
       <span class="who">${esc(r.customer)}</span><span class="rules">${esc(r.rules.join(", "))}</span>
     </button>`).join("") || `<div class="empty">No cases match these filters.</div>`;
  if (desired !== state.current || !desired) openCase(desired);
  else updateCaseNavigation();
}

function moveSelection(e) {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const i = state.view.findIndex((r) => r.case_id === state.current);
  const next = state.view[Math.max(0, Math.min(state.view.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
  if (next) { openCase(next.case_id); const el = $("list").querySelector(`[data-id="${CSS.escape(next.case_id)}"]`); el && el.focus(); }
}

function updateCaseNavigation() {
  const index = state.view.findIndex((r) => r.case_id === state.current);
  if ($("case-position")) $("case-position").textContent = index >= 0 ? `Case ${index + 1} of ${state.view.length}` : "";
  if ($("previous-case")) $("previous-case").disabled = index <= 0;
  if ($("next-case")) $("next-case").disabled = index < 0 || index >= state.view.length - 1;
}

function stepCase(offset) {
  const index = state.view.findIndex((r) => r.case_id === state.current);
  const next = state.view[index + offset];
  if (next) {
    const target = offset > 0 ? "next-case" : "previous-case";
    openCase(next.case_id).then(() => {
      if (state.current === next.case_id && $(target) && !$(target).disabled) $(target).focus();
    });
  }
}

async function openCase(id, fromHash) {
  const request = ++state.caseRequest;
  state.current = id || null;
  state.data = null;
  document.querySelectorAll(".row").forEach((r) => { r.setAttribute("aria-current", String(r.dataset.id === id)); r.setAttribute("aria-selected", String(r.dataset.id === id)); });
  if (!fromHash) history.replaceState(null, "", "#" + state.inst + (id ? "/" + id : ""));
  if (!id) {
    $("case").innerHTML = `<div class="empty">No cases match these filters. Change the search or filters to continue.</div>`;
    return;
  }
  $("case").innerHTML = `<div class="empty" role="status">Loading case...</div>`;
  try {
    const data = await get(`/api/case?inst=${encodeURIComponent(state.inst)}&id=${encodeURIComponent(id)}`);
    if (request !== state.caseRequest) return;
    state.data = data;
  } catch (e) {
    if (request === state.caseRequest) $("case").innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  renderCase();
  updateCaseNavigation();
  $("case").scrollTop = 0;
  $("list").querySelector(`[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
}

function renderMarkdown(text) {
  const lines = text.split("\n").filter((l) => !/^# /.test(l) && !/^\*\*Document ID:\*\*/.test(l));
  let html = "", dl = [], table = [], para = [];
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const flush = () => {
    if (dl.length) { html += "<dl>" + dl.map(([k, v]) => `<dt>${inline(k)}</dt><dd>${inline(v)}</dd>`).join("") + "</dl>"; dl = []; }
    if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; }
    if (table.length) {
      const rows = table.filter((r) => !/^\|\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
      const [h, ...b] = rows;
      html += `<div class="table-wrap"><table><thead><tr>${h.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
        b.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>";
      table = [];
    }
  };
  for (const raw of lines) {
    const l = raw.trim();
    const kv = l.match(/^\*\*([^*]+?):\*\*\s*(.*)$/);
    if (!l) { flush(); continue; }
    if (l.startsWith("|")) { if (dl.length || para.length) { const t = table; table = []; flush(); table = t; } table.push(l); continue; }
    if (table.length) flush();
    if (kv) { if (para.length) { const d = dl; dl = []; flush(); dl = d; } dl.push([kv[1], kv[2]]); continue; }
    if (dl.length) flush();
    para.push(l.replace(/^#+\s*/, "").replace(/^[-*]\s+/, ""));
  }
  flush();
  return html;
}

function evidenceLink(id, data) {
  const doc = data.documents.find((x) => x.doc_id === id);
  const tx = data.transactions.find((x) => x.transaction_id === id);
  const review = data.reviews.find((x) => x.review_id === id);
  const entry = data.listed.find((x) => x.entry_id === id);
  let label = doc ? (doc.title || (doc.type || "Document").replace(/_/g, " "))
    : tx ? `${gbp(tx.amount_gbp)} ${tx.direction === "in" ? "from" : "to"} ${tx.counterparty_name || tx.location || "cash"}`
    : review ? `Earlier review${review.reviewed_on ? ", " + dateFmt(review.reviewed_on) : ""}`
    : entry ? `Internal list: ${entry.name}` : "Evidence record";
  return `<button class="ref" data-ref="${esc(id)}"><span class="ref-label">${esc(label)}<span class="ref-id">${esc(id)}</span></span><span class="ref-action">View</span></button>`;
}

function reviewPanel(data) {
  const review = caseReview(data.institution, data.case.case_id);
  const selected = review?.verdict || data.decision?.verdict || "";
  return `<section class="review-panel" aria-label="Analyst decision">
    <div class="review-heading"><h2 id="decision-title"><label for="analyst-verdict">Decision</label></h2>
      <select id="analyst-verdict" ${reviewLoadError ? "disabled" : ""}>
        <option value="" disabled ${!selected ? "selected" : ""}>Choose a decision</option>
        ${["CLOSE", "RFI", "ESCALATE"].map((v) => `<option value="${v}" ${selected === v ? "selected" : ""}>${esc(VERDICT[v])}</option>`).join("")}
      </select>
    </div>
    <p class="review-state" id="review-state" role="status">${review ? "Analyst decision saved in this browser. " + esc(dateFmt(review.saved_at)) : "Using the system recommendation. Change the decision to record your review."}</p>
    ${review ? `<p class="review-note-label">Analyst note</p><p class="review-note">${esc(review.note)}</p><div class="review-actions"><button class="text-button" id="edit-review">Edit note</button><button class="text-button" id="reset-review">Use system recommendation</button></div>` : ""}
    <form class="review-edit" id="review-form" hidden>
      <label for="analyst-note">Reason for your decision</label>
      <textarea id="analyst-note" required maxlength="4000" placeholder="Explain the evidence and why this decision is appropriate.">${esc(review?.note || "")}</textarea>
      <div class="review-actions"><button class="primary-button" type="submit">Save decision</button><button class="nav-button" type="button" id="cancel-review">Cancel</button></div>
    </form>
    <p class="review-error" id="review-error" role="alert" hidden></p>
  </section>`;
}

function persistReview(inst, id, review) {
  if (reviewLoadError) throw new Error("Browser storage is unavailable. Your decision has not been saved.");
  const next = { ...savedReviews };
  if (review) next[reviewKey(inst, id)] = review;
  else delete next[reviewKey(inst, id)];
  localStorage.setItem(REVIEW_KEY, JSON.stringify(next));
  savedReviews = next;
}

function bindReviewEditor(data) {
  const inst = data.institution, id = data.case.case_id;
  const review = caseReview(inst, id);
  const initial = review?.verdict || data.decision?.verdict || "";
  const form = $("review-form"), verdict = $("analyst-verdict");
  const showError = (e) => { $("review-error").textContent = e.message || "Your decision could not be saved."; $("review-error").hidden = false; };
  const edit = () => { form.hidden = false; $("review-error").hidden = true; $("review-state").textContent = "Unsaved changes. Add a reason and save your decision."; $("analyst-note").focus(); };
  verdict.addEventListener("change", edit);
  $("edit-review")?.addEventListener("click", edit);
  $("cancel-review").addEventListener("click", () => { verdict.value = initial; $("analyst-note").value = review?.note || ""; form.hidden = true; $("review-error").hidden = true; $("review-state").textContent = review ? "Analyst decision saved in this browser. " + dateFmt(review.saved_at) : "Using the system recommendation. Change the decision to record your review."; });
  const refresh = () => {
    state.rows = state.rows.map((row) => effectiveRow(row, inst));
      renderCase();
    applyFilters();
    updateCaseNavigation();
  };
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const note = $("analyst-note").value.trim();
    if (!note) { $("analyst-note").setCustomValidity("Add a reason for your decision."); $("analyst-note").reportValidity(); return; }
    try { persistReview(inst, id, { verdict: verdict.value, note, saved_at: new Date().toISOString() }); refresh(); }
    catch (e) { showError(e); }
  });
  $("analyst-note").addEventListener("input", () => $("analyst-note").setCustomValidity(""));
  $("reset-review")?.addEventListener("click", () => {
    try { persistReview(inst, id, null); refresh(); }
    catch (e) { showError(e); }
  });
}

function renderCase() {
  const d = state.data, c = d.case, cu = d.customer, dec = d.decision || { verdict: "MISSING", evidence: [] };
  const dcl = cu.declared || {};
  const ev = new Set(dec.evidence || []);
  const txs = d.transactions;
  const shown = txs.filter((t) => t.alerted || t.cited || t.held);
  const rest = txs.length - shown.length;
  const income = dcl.monthly_income_gbp != null ? gbp(dcl.monthly_income_gbp) + " a month"
    : dcl.annual_turnover_gbp != null ? gbp(dcl.annual_turnover_gbp) + " a year" : "Not declared";

  const txRows = (list) => list.map((t) => `
    <tr id="tx-${esc(t.transaction_id)}" class="${t.cited ? "cited" : ""}">
      <td class="when">${esc(dateFmt(t.booked_at))}</td>
      <td class="tid">${esc(t.transaction_id)}</td>
      <td>${t.direction === "in" ? "In" : "Out"}</td>
      <td>${esc((t.channel || "").replace(/_/g, " "))}</td>
      <td>${esc(t.counterparty_name || (t.location || ""))}${t.counterparty_country && t.counterparty_country !== "United Kingdom" ? `<div class="tag">${esc(t.counterparty_country)}</div>` : ""}</td>
      <td>${esc(t.reference || "")}</td>
      <td class="num">${t.direction === "out" ? "−" : ""}${esc(gbp(t.amount_gbp))}</td>
      <td>${[t.cited ? `<span class="tag on">Relied on</span>` : "", t.held ? `<span class="tag on">Held payment</span>` : "", t.alerted ? `<span class="tag">Alerted</span>` : ""].filter(Boolean).join("<br>")}</td>
    </tr>`).join("");

  $("case").innerHTML = `<div class="case-inner">
    <div class="case-toolbar">
      <span class="eyebrow">Case ${esc(c.case_id)}</span>
      <nav class="case-navigation" aria-label="Case navigation">
        <span class="case-position" id="case-position"></span>
        <button class="nav-button" id="previous-case" aria-label="Previous case">Previous</button>
        <button class="nav-button" id="next-case" aria-label="Next case">Next</button>
      </nav>
    </div>
    <div class="head">
      <h1>${esc(cu.name || c.case_id)}</h1>
      <div class="sub"><span>${cu.kind === "business" ? "Business account" : "Personal account"}</span><span>Review period: ${esc(dateFmt(c.review_window?.from))} to ${esc(dateFmt(c.review_window?.to))}</span></div>
    </div>

    <section class="case-section" aria-labelledby="decision-title">
      ${reviewPanel(d)}
      <div class="decision ${esc(dec.verdict)}">
        <div class="recommendation-label">System recommendation</div>
        <div class="line">${verdictHtml(dec.verdict)}<span class="code">${esc(words(dec.reason_code))}</span></div>
        <p>${esc(dec.reason || "The system has not written a decision for this case.")}</p>
      </div>
    </section>

    <section class="case-section" aria-labelledby="evidence-title">
      <h2 id="evidence-title">Evidence</h2>
      ${ev.size ? `<div class="evidence" aria-label="Evidence relied on">${[...ev].map((e) => evidenceLink(e, d)).join("")}</div>` : `<p>No evidence references recorded.</p>`}
    </section>

    <section class="case-section" aria-labelledby="details-title">
      <h2 id="details-title">Case details</h2>
    <details class="dossier" open>
      <summary>Why this was flagged<span class="n">${d.alerts.length}</span></summary>
      <div class="section-body">
      ${d.alerts.map((a) => `<div class="alert"><div class="name"><span class="rid">${esc(a.rule_id)}</span>${esc(a.rule_name)}</div><p>${esc(a.message)}</p></div>`).join("")}
      </div>
    </details>

    <details class="dossier">
      <summary>Customer profile</summary>
      <div class="section-body">
      <dl class="facts">
        <div><dt>Name</dt><dd>${esc(cu.name)}</dd></div>
        <div><dt>${cu.kind === "business" ? "Business" : "Occupation"}</dt><dd>${esc(cu.business_activity || cu.occupation || "")}</dd></div>
        <div><dt>Declared ${cu.kind === "business" ? "turnover" : "income"}</dt><dd>${esc(income)}</dd></div>
        <div><dt>Source of funds</dt><dd>${esc(dcl.source_of_funds || "")}</dd></div>
        <div><dt>Expected countries</dt><dd>${esc((dcl.expected_countries || []).join(", "))}</dd></div>
        <div><dt>Risk rating</dt><dd>${esc(cu.risk_rating || "")}</dd></div>
        <div><dt>Customer since</dt><dd>${esc(dateFmt(cu.onboarded_on))}</dd></div>
        <div><dt>Customer ID</dt><dd>${esc(cu.customer_id)}</dd></div>
      </dl>
      </div>
    </details>

    <details class="dossier">
      <summary>Transactions<span class="n">${shown.length} linked to this case${rest ? `, ${txs.length} available` : ""}</span></summary>
      <div class="section-body">
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>ID</th><th>Direction</th><th>Channel</th><th>Counterparty</th><th>Reference</th><th class="num">Amount</th><th>Status</th></tr></thead>
        <tbody id="txbody">${txRows(shown)}</tbody>
      </table></div>
      ${rest ? `<button class="toggle" id="showall">Show all ${txs.length} transactions</button>` : ""}
      </div>
    </details>

    <details class="dossier">
      <summary>Documents<span class="n">${d.documents.length}</span></summary>
      <div class="section-body">
      ${d.documents.map((doc) => `
        <details class="doc" id="doc-${esc(doc.doc_id)}">
          <summary><span class="t">${esc(doc.title || doc.doc_id)}</span><span class="meta">${esc(doc.doc_id)}, ${esc(dateFmt(doc.dated))}</span>${doc.cited ? `<span class="tag on">Relied on</span>` : ""}</summary>
          <div class="body">${renderMarkdown(doc.text || "")}</div>
        </details>`).join("") || `<p class="tag">No documents on file.</p>`}
      </div>
    </details>

    ${d.listed.length ? `<details class="dossier"><summary>Internal list<span class="n">${d.listed.length}</span></summary><div class="section-body">${d.listed.map((e) => `
      <div class="note ${e.cited ? "cited" : ""}" id="ref-${esc(e.entry_id)}">
        <div><strong>${esc(e.name)}</strong>, entry ${esc(e.entry_id)}</div>
        <div class="meta">${e.date_of_birth ? "Born " + esc(dateFmt(e.date_of_birth)) + ". " : ""}${esc(e.address || "")}</div>
        <div>${esc(e.reason)}</div></div>`).join("")}</div></details>` : ""}

    ${d.reviews.length ? `<details class="dossier"><summary>Earlier reviews<span class="n">${d.reviews.length}</span></summary><div class="section-body">${d.reviews.map((r) => `
      <div class="note ${r.cited ? "cited" : ""}" id="ref-${esc(r.review_id)}">
        <div class="meta">${esc(r.review_id)}, ${esc(r.rule_id)}, ${esc(dateFmt(r.reviewed_on))}${r.cited ? ", relied on" : ""}</div>
        <div>${esc(r.note)}</div></div>`).join("")}</div></details>` : ""}
    </section>
  </div>`;

  bindReviewEditor(d);
  $("previous-case").addEventListener("click", () => stepCase(-1));
  $("next-case").addEventListener("click", () => stepCase(1));
  const all = $("showall");
  if (all) all.addEventListener("click", () => { $("txbody").innerHTML = txRows(txs); all.remove(); });
  $("case").querySelectorAll(".ref").forEach((b) => b.addEventListener("click", () => jumpTo(b.dataset.ref)));
}

function jumpTo(ref) {
  let el = document.getElementById("doc-" + ref) || document.getElementById("ref-" + ref) || document.getElementById("tx-" + ref);
  if (!el && $("showall")) { $("showall").click(); el = document.getElementById("tx-" + ref); }
  if (!el) return;
  for (let node = el; node && node !== $("case"); node = node.parentElement) {
    if (node.tagName === "DETAILS") node.open = true;
  }
  el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

init();
</script>
</body>
</html>
